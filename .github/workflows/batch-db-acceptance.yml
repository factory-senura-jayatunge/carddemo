          CASESTSV
      - name: Tested tree, workflow commit, case list and source checks (before any network use)
        timeout-minutes: 3
        env:
          # Read here, outside the test environment, and recorded under plain names.
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          PUSHED_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: /usr/bin/python3 -I -B "$ACCEPTANCE_DIR/helper.py" tree 2>> "$ACCEPTANCE_DIR/private/helper.stderr"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        timeout-minutes: 10
        with:
          distribution: temurin
          java-version-file: modernization/.java-version
          overwrite-settings: false
          # Otherwise the action exports MAVEN_ARGS=-ntp, which the preflight forbids; -ntp is on every command.
          show-download-progress: true
          cache-jdk: false
          problem-matcher: false
      - name: Record the JDK (patch level recorded, not pinned)
        timeout-minutes: 2
        run: /usr/bin/python3 -I -B "$ACCEPTANCE_DIR/helper.py" jdk 2>> "$ACCEPTANCE_DIR/private/helper.stderr"
      - name: Preflight and settings (fails, never installs)
        timeout-minutes: 2
        run: |
          test "$(id -u)" -ne 0
          for p in /bin/sh /usr/bin/env /usr/bin/timeout /usr/bin/python3 /usr/bin/git /usr/bin/docker /usr/bin/date \
                   /usr/bin/touch; do test -x "$p"; done
          /usr/bin/python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'
          bad=$(env | cut -d= -f1 | grep -cE '^(CARDDEMO_[A-Z0-9_]*|MSSQL_SA_PASSWORD|MSSQL_HOST_PORT|MAVEN_OPTS|MAVEN_ARGS|JAVA_TOOL_OPTIONS|JDK_JAVA_OPTIONS|_JAVA_OPTIONS|TESTCONTAINERS_[A-Z0-9_]*)$' || true)
          test "$bad" -eq 0
          cat > "$ACCEPTANCE_DIR/settings.xml" <<'XML'
          <settings>
            <mirrors><mirror><id>central-only</id><mirrorOf>*</mirrorOf><url>https://repo.maven.apache.org/maven2</url></mirror></mirrors>
          </settings>
          XML
          cat > "$ACCEPTANCE_DIR/settings-offline.xml" <<'XML'
          <settings>
            <offline>true</offline>
            <mirrors><mirror><id>central-only</id><mirrorOf>*</mirrorOf><url>https://repo.maven.apache.org/maven2</url></mirror></mirrors>
          </settings>
          XML
      # ---- bounded online prepare: images by digest, fresh private repository and wrapper home, no cache ----
      - name: Pull the database and reaper images by digest (online)
        timeout-minutes: 10
        run: |
          D=(env -i HOME="$ACCEPTANCE_DIR/home" PATH=/usr/bin:/bin)
          L="$ACCEPTANCE_DIR/pull.log"
          rc=0
          "${D[@]}" /usr/bin/timeout -k 10 420 /usr/bin/docker pull -q "$MSSQL_IMAGE" > "$L" 2>&1 < /dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            "${D[@]}" /usr/bin/timeout -k 10 120 /usr/bin/docker pull -q "$RYUK_IMAGE" >> "$L" 2>&1 < /dev/null || rc=$?
          fi
          if [ "$rc" = 0 ]; then
            id=$("${D[@]}" /usr/bin/docker image inspect -f '{{.Id}}' "$RYUK_IMAGE" 2>> "$L") || rc=$?
          fi
          if [ "$rc" = 0 ]; then
            "${D[@]}" /usr/bin/docker tag "$id" "$RYUK_IMAGE_TAG" >> "$L" 2>&1 < /dev/null || rc=$?
          fi
          echo "$rc" > "$ACCEPTANCE_DIR/pull.rc"
      - name: Image digests and reaper tag (typed lines only)
        timeout-minutes: 2
        run: /usr/bin/python3 -I -B "$ACCEPTANCE_DIR/helper.py" images 2>> "$ACCEPTANCE_DIR/private/helper.stderr"
      - name: Populate (online, strict checksums; compiles, runs no test)
        timeout-minutes: 16
        working-directory: modernization
        run: |
          E=(env -i HOME="$ACCEPTANCE_DIR/home" PATH="$JAVA_HOME/bin:/usr/bin:/bin" LANG=C.UTF-8 TMPDIR="$ACCEPTANCE_DIR/tmp"
             JAVA_HOME="$JAVA_HOME" MAVEN_USER_HOME="$ACCEPTANCE_DIR/mvnw" MAVEN_SKIP_RC=true)
          rc=0
          "${E[@]}" /usr/bin/timeout -k 10 900 ./mvnw -C -B -ntp -Dstyle.color=never \
            -s "$ACCEPTANCE_DIR/settings.xml" -gs "$ACCEPTANCE_DIR/settings.xml" -Dmaven.repo.local="$ACCEPTANCE_DIR/m2" \
            clean test -pl batch/batch-service -am '-Dtest=NoSuchTestClass' -Dsurefire.failIfNoSpecifiedTests=false \
            > "$ACCEPTANCE_DIR/prepare.log" 2>&1 < /dev/null || rc=$?
          echo "$rc" > "$ACCEPTANCE_DIR/prepare.rc"
      - name: Seed the Surefire JUnit Platform provider (online, strict checksums, pinned versions)
        timeout-minutes: 12
        working-directory: modernization
        run: |
          T() { /usr/bin/python3 -I -c 'import json, os, sys; print(json.loads(os.environ["TOOLCHAIN"])[sys.argv[1]])' "$1"; }
          E=(env -i HOME="$ACCEPTANCE_DIR/home" PATH="$JAVA_HOME/bin:/usr/bin:/bin" LANG=C.UTF-8 TMPDIR="$ACCEPTANCE_DIR/tmp"
             JAVA_HOME="$JAVA_HOME" MAVEN_USER_HOME="$ACCEPTANCE_DIR/mvnw" MAVEN_SKIP_RC=true)
          rc=0
          "${E[@]}" /usr/bin/timeout -k 10 300 ./mvnw -C -B -ntp -N -Dstyle.color=never \
            -s "$ACCEPTANCE_DIR/settings.xml" -gs "$ACCEPTANCE_DIR/settings.xml" -Dmaven.repo.local="$ACCEPTANCE_DIR/m2" \
            "org.apache.maven.plugins:maven-dependency-plugin:$(T dependency_plugin):get" \
            "-Dartifact=org.apache.maven.surefire:surefire-junit-platform:$(T surefire)" -Dtransitive=true \
            > "$ACCEPTANCE_DIR/seed.log" 2>&1 < /dev/null || rc=$?
          "${E[@]}" /usr/bin/timeout -k 10 300 ./mvnw -C -B -ntp -N -Dstyle.color=never \
            -s "$ACCEPTANCE_DIR/settings.xml" -gs "$ACCEPTANCE_DIR/settings.xml" -Dmaven.repo.local="$ACCEPTANCE_DIR/m2" \
            "org.apache.maven.plugins:maven-dependency-plugin:$(T dependency_plugin):get" \
            "-Dartifact=org.junit.platform:junit-platform-launcher:$(T junit_platform)" -Dtransitive=true \
            >> "$ACCEPTANCE_DIR/seed.log" 2>&1 < /dev/null || rc=$?
          echo "$rc" > "$ACCEPTANCE_DIR/seed.rc"
      - name: Typed prepare summary (no raw log in the job log)
        timeout-minutes: 5
        run: /usr/bin/python3 -I -B "$ACCEPTANCE_DIR/helper.py" prep-summary 2>> "$ACCEPTANCE_DIR/private/helper.stderr"
      # ---- offline tests: the same repository and wrapper home, Maven offline, the same images ----
      - name: Batch service tests on SQL Server (Maven offline, pinned filter, parallel off; output private)
        # Maven's own limit is 300 s below this step's limit. The 300 s cover the rest of this step: the check
        # before the tests (stopped after 240 s, killed 5 s later), the environment check and the start files
        # (seconds), Maven's 10 s kill grace, and the exit code and end files (seconds).
        timeout-minutes: 266
        working-directory: modernization
        run: |
          /usr/bin/date +%s > "$ACCEPTANCE_DIR/test.step.t0"
          /usr/bin/timeout -k 5 240 /usr/bin/python3 -I -B "$ACCEPTANCE_DIR/helper.py" before-test \
            2>> "$ACCEPTANCE_DIR/private/helper.stderr" \
            || { echo not-started > "$ACCEPTANCE_DIR/test.rc"; /usr/bin/date +%s > "$ACCEPTANCE_DIR/test.step.t1"; exit 0; }
          E=(env -i HOME="$ACCEPTANCE_DIR/home" PATH="$JAVA_HOME/bin:/usr/bin:/bin" LANG=C.UTF-8 TMPDIR="$ACCEPTANCE_DIR/tmp"
             JAVA_HOME="$JAVA_HOME" MAVEN_USER_HOME="$ACCEPTANCE_DIR/mvnw" MAVEN_SKIP_RC=true)
          names=$("${E[@]}" /usr/bin/env | cut -d= -f1 | LC_ALL=C sort | tr '\n' ' ')
          echo "$names" > "$ACCEPTANCE_DIR/test.envnames"
          if [ "$names" != "HOME JAVA_HOME LANG MAVEN_SKIP_RC MAVEN_USER_HOME PATH TMPDIR " ]; then
            echo bad > "$ACCEPTANCE_DIR/test.stepenv"; echo not-started > "$ACCEPTANCE_DIR/test.rc"
            /usr/bin/date +%s > "$ACCEPTANCE_DIR/test.step.t1"; exit 0
          fi
          echo ok > "$ACCEPTANCE_DIR/test.stepenv"
          /usr/bin/touch "$ACCEPTANCE_DIR/start.marker"
          /usr/bin/date +%s > "$ACCEPTANCE_DIR/test.mvn.t0"
          rc=0
          "${E[@]}" /usr/bin/timeout -k 10 "$TEST_MAVEN_LIMIT_S" ./mvnw -o -B -ntp -Dstyle.color=never \
            -s "$ACCEPTANCE_DIR/settings-offline.xml" -gs "$ACCEPTANCE_DIR/settings-offline.xml" -Dmaven.repo.local="$ACCEPTANCE_DIR/m2" \
            clean test -pl batch/batch-service -am '-Dtest=org/carddemo/batch/**/*Test,org/carddemo/batch/**/*Tests' \
            -Dsurefire.failIfNoSpecifiedTests=false -Djunit.jupiter.execution.parallel.enabled=false \
            > "$ACCEPTANCE_DIR/test.log" 2>&1 < /dev/null || rc=$?
          /usr/bin/date +%s > "$ACCEPTANCE_DIR/test.mvn.t1"
          echo "$rc" > "$ACCEPTANCE_DIR/test.rc"
          echo $(( $(/usr/bin/date +%s) + 1 )) > "$ACCEPTANCE_DIR/test.t1"
          /usr/bin/date +%s > "$ACCEPTANCE_DIR/test.step.t1"
      # ---- evidence ----
      - name: Reconcile and decide (typed lines only)
        id: verdict
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: /usr/bin/python3 -I -B "$ACCEPTANCE_DIR/helper.py" verdict 2>> "$ACCEPTANCE_DIR/private/helper.stderr"
      - name: Upload typed evidence only
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: batch-db-acceptance-evidence
          path: ${{ runner.temp }}/acceptance/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Verdict
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        env:
          VERDICT_OK: ${{ steps.verdict.outputs.ok }}
        run: test "$VERDICT_OK" = true
