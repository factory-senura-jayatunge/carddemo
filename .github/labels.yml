# Label taxonomy for CardDemo. Synced by .github/workflows/label-sync.yml.
# The GitHub default labels are kept so the sync never removes labels that
# existing issues already use.

# --- Type ---
- name: "bug"
  color: "#d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "#a2eeef"
  description: "New feature or request"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"
- name: "type: typo"
  color: "#c5def5"
  description: "Spelling fixes in comments, field names or JCL text"
- name: "type: build"
  color: "#bfd4f2"
  description: "Compile errors, compile JCL, line endings, encoding"
- name: "type: data"
  color: "#fef2c0"
  description: "Sample data files (ASCII or EBCDIC), layouts, loading"
- name: "dependencies"
  color: "#0366d6"
  description: "Dependency updates (Dependabot)"
- name: "security"
  color: "#b60205"
  description: "Security hardening. Report vulnerabilities privately, not in issues"

# --- Priority ---
- name: "P0"
  color: "#b60205"
  description: "Critical: blocks install, compile or the batch cycle for everyone"
- name: "P1"
  color: "#d93f0b"
  description: "High: wrong results or a broken module with no workaround"
- name: "P2"
  color: "#fbca04"
  description: "Medium: defect with a workaround, or a needed improvement"
- name: "P3"
  color: "#0e8a16"
  description: "Low: cosmetic, typo, nice to have"

# --- Area (module) ---
- name: "area: base-online"
  color: "#5319e7"
  description: "Base CICS online programs and BMS maps (CC00, CM00, CA00, ...)"
- name: "area: base-batch"
  color: "#5319e7"
  description: "Base batch programs and JCL (POSTTRAN, INTCALC, CREASTMT, ...)"
- name: "area: vsam"
  color: "#5319e7"
  description: "VSAM file definitions, loads, AIX and CICS file control"
- name: "area: db2-trantype"
  color: "#1d76db"
  description: "Optional Db2 transaction type management (app-transaction-type-db2)"
- name: "area: ims-db2-mq-auth"
  color: "#1d76db"
  description: "Optional IMS/Db2/MQ pending authorizations (app-authorization-ims-db2-mq)"
- name: "area: vsam-mq"
  color: "#1d76db"
  description: "Optional MQ account extraction (app-vsam-mq)"
- name: "area: export-import"
  color: "#1d76db"
  description: "CBEXPORT / CBIMPORT data export and import"
- name: "area: scheduler"
  color: "#1d76db"
  description: "CA7 and Control-M scheduler definitions"
- name: "area: tooling"
  color: "#1d76db"
  description: "Scripts, lint, local build, tests and CI"

# --- Status and triage (GitHub defaults kept) ---
- name: "needs-triage"
  color: "#ededed"
  description: "New issue, not yet reviewed by a maintainer"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
