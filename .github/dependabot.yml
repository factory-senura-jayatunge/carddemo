version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it (minimum release age).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - "area: tooling"
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      devcontainer-images:
        patterns:
          - "*"
    labels:
      - dependencies
      - "area: tooling"
    commit-message:
      prefix: "build"
