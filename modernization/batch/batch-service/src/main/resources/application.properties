spring.application.name=batch-service
spring.main.banner-mode=off
spring.main.web-application-type=none

# The job repository lives in the batch schema (V401); batch-service never creates it.
spring.batch.jdbc.table-prefix=batch.BATCH_
spring.batch.jdbc.initialize-schema=never
spring.batch.job.name=dataLoadJob

spring.datasource.url=jdbc:sqlserver://127.0.0.1:${MSSQL_HOST_PORT:21433};databaseName=${CARDDEMO_DB_NAME:carddemo};encrypt=true;trustServerCertificate=true
# The login db-migrate creates: CARDDEMO_DB_LOGIN_PREFIX (default <database>_) + batch.
spring.datasource.username=${CARDDEMO_DB_LOGIN_PREFIX:${CARDDEMO_DB_NAME:carddemo}_}batch
spring.datasource.password=${CARDDEMO_DB_BATCH_PASSWORD:}

carddemo.data-load.source-dir=${CARDDEMO_LOAD_SOURCE_DIR:../app/data/ASCII}
# D-41: a reload of non-empty tables only in local and demo environments (profile demo).
carddemo.data-load.reload-allowed=false
