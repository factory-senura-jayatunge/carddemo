spring.application.name=batch-service
spring.main.banner-mode=off
# The default is the one-shot load (make load, LoadCommand); the profile server serves the
# internal API instead.
spring.main.web-application-type=none
carddemo.batch.command=load
# Jobs start only through LoadCommand or the internal API, with the contract's parameters and
# window rules, never through Boot's job runner.
spring.autoconfigure.exclude=org.springframework.boot.batch.autoconfigure.BatchJobLauncherAutoConfiguration

# The job repository lives in the batch schema (V401); batch-service never creates it.
spring.batch.jdbc.table-prefix=batch.BATCH_
spring.batch.jdbc.initialize-schema=never

spring.datasource.url=jdbc:sqlserver://127.0.0.1:${MSSQL_HOST_PORT:21433};databaseName=${CARDDEMO_DB_NAME:carddemo};encrypt=true;trustServerCertificate=true
# The login db-migrate creates: CARDDEMO_DB_LOGIN_PREFIX (default <database>_) + batch.
spring.datasource.username=${CARDDEMO_DB_LOGIN_PREFIX:${CARDDEMO_DB_NAME:carddemo}_}batch
spring.datasource.password=${CARDDEMO_DB_BATCH_PASSWORD:}

carddemo.data-load.source-dir=${CARDDEMO_LOAD_SOURCE_DIR:../app/data/ASCII}
# DEF-ACUP-002 fixed mode: the layout manifest of acctdata.txt, bound by its SHA-256. Unset: the
# built-in manifest of the ASCII sample, by hash only. Legacy mode never reads it.
#carddemo.data-load.account-layout-manifest=
# One-shot load only: an absolute path, created 0600 before the window opens, that receives the
# dataLoadJob execution ID (load report contract section 1).
#carddemo.batch.load.execution-id-file=
# D-41: a reload of non-empty tables only in local and demo environments (profile demo).
carddemo.data-load.reload-allowed=false
# The business date of the one-shot load's run-keyed parameters (contract section 2.1).
carddemo.batch.business-date=${CARDDEMO_BUSINESS_DATE:2022-07-06}

# CARDDEMO_VAR_DIR, absolute, with no default (batch-execution-contract.md section 4.10): the
# cycle's inbound daily file is <var-dir>/inbound/dailytran/<businessDate>.txt, and every output
# (rejects, the daily file archive) is under the instance root <var-dir>/out/<database>/<instance>/.
carddemo.var-dir=${CARDDEMO_VAR_DIR:}
# Records per transaction of the chunked steps.
carddemo.batch.files.chunk-size=100

# calculateInterestJob: the INTCALC JCL PARM, the prefix of the interest transaction IDs while
# DEF-JINTC-001 and DEF-INTC-010 are legacy (the parity runs); fixed mode uses the cycle's date.
carddemo.batch.interest.legacy-parm=${CARDDEMO_INTEREST_LEGACY_PARM:2022071800}

# Pending authorizations: the sample unload the load reads, the expiry of the purge and of D-33
# matching (expiryDays), and the purge's summaries per transaction (commitInterval, at least 1).
carddemo.batch.pauth.source-file=${CARDDEMO_PAUTH_SOURCE_FILE:../app/app-authorization-ims-db2-mq/data/EBCDIC/AWS.M2.CARDDEMO.IMSDATA.DBPAUTP0.dat}
carddemo.batch.pauth.expiry-days=5
carddemo.batch.pauth.commit-interval=5

# The internal API (profile server): loopback only, the bearer token from the shared .env.
server.address=127.0.0.1
server.port=${CARDDEMO_BATCH_PORT:28090}
carddemo.batch.internal.token=${CARDDEMO_BATCH_INTERNAL_TOKEN:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
