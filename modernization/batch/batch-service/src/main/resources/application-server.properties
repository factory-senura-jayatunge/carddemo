# Server mode: the internal API on 127.0.0.1:28090 (batch-execution-contract.md). No job starts
# by itself; each launch returns at once (202) and the job runs on its own thread.
spring.main.web-application-type=servlet
spring.batch.job.enabled=false
carddemo.batch.command=none
carddemo.batch.async-launch=true
