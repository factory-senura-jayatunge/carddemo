server:
  address: 127.0.0.1
  port: 28086

spring:
  application:
    name: authorization-service
  main:
    banner-mode: off
  datasource:
    url: jdbc:sqlserver://127.0.0.1:${MSSQL_HOST_PORT:21433};databaseName=${CARDDEMO_DB_NAME:carddemo};encrypt=true;trustServerCertificate=true
    username: ${CARDDEMO_DB_AUTHORIZATION_USER:${CARDDEMO_DB_NAME:carddemo}_authorization}
    password: ${CARDDEMO_DB_AUTHORIZATION_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  mvc:
    problemdetails:
      enabled: false
  # The broker login of messaging.md: virtual host carddemo, user authorization_svc. Infra creates
  # both and passes the password; nothing here creates or changes a broker user or permission.
  rabbitmq:
    host: 127.0.0.1
    port: ${RABBITMQ_AMQP_HOST_PORT:25672}
    virtual-host: ${CARDDEMO_RABBITMQ_VHOST:carddemo}
    username: ${CARDDEMO_RABBITMQ_AUTHORIZATION_USER:authorization_svc}
    password: ${CARDDEMO_RABBITMQ_AUTHORIZATION_PASSWORD:}
    publisher-confirm-type: correlated
    # Replies are published mandatory: an unroutable one comes back and is logged (contract §4.4).
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

carddemo:
  authorization:
    listener:
      concurrency: 4
  security:
    issuer: carddemo-identity
    audience: carddemo-api
    cookie-secure: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    version: openapi_3_1
  override-with-generic-response: false
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
