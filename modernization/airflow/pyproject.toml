[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carddemo-airflow"
version = "0.1.0"
description = "Shared operators and settings of the CardDemo Airflow DAGs"
requires-python = ">=3.12"
dependencies = ["apache-airflow>=3.3,<3.4", "httpx"]

[tool.setuptools]
packages = ["carddemo_airflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
