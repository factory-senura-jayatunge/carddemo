# Accepted deviations: items the target does not reproduce, so they have no legacy mode.
#
# kind         architecture-dependent (the mechanism is gone), security-c1 (access model C1),
#              incidental-ui (screen or commarea artefact), decision (a catalog decision changes it)
# decision     the decision of docs/modernization/decisions/README.md, or "none"
# target       what the target does instead; legacy: what the COBOL does, when not obvious
# group        the shared reason when several items deviate for it
# scenarios    equivalence scenarios whose legacy result the target does not reproduce ("COSGN00C S10")
# approved_by, approved_on   who accepted the deviation, and when (YYYY-MM-DD)
#
# make verify-ledger checks that every item exists in the spec and that every architecture-dependent
# item of docs/modernization/architecture/decisions.md has an entry of that kind.
# Fields: modernization/verify/trace/README.md.

schema = 1

# invariants

[deviation."INV-002"]
kind = "decision"
decision = "D-18"
legacy = "CLOSEFIL closes the online files for the cycle, so the online functions stop."
target = "The batch window runs in mode WRITES_BLOCKED: sign-on and every read keep working, writes are refused while the cycle runs"
scenarios = ["COSGN00C S10"]
source = "catalog D-18 (override), docs/modernization/architecture/decisions.md D-BAT-05"
approved_by = "user (decision catalog answers)"
approved_on = "2026-11-06"

[deviation."INV-006"]
kind = "security-c1"
decision = "D-01"
group = "DEV-C1"
legacy = "Menus and screens open without a sign-on, the identity lives in client-held fields that any program can set, and no function checks a role."
target = "Access model C1: every screen and API needs a session; user ID and role (ADMIN or USER from the user type) come only from the session; ADMIN-only functions check the role on the server; staff may open any account. Sensitive fields are masked by default, ADMIN may unmask, every view is audited (D-09). The cardholder model C2 comes later."
approved_by = "user (decision catalog answers)"
approved_on = "2026-11-06"

