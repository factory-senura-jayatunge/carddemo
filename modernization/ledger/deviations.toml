# Accepted deviations: items the target does not reproduce, so they have no legacy mode.
#
# kind         architecture-dependent (the mechanism is gone), security-c1 (access model C1),
#              incidental-ui (screen or commarea artefact), decision (a catalog decision changes it)
# decision     the decision of docs/modernization/decisions/README.md, or "none"
# target       what the target does instead; legacy: what the COBOL does, when not obvious
# group        the shared reason when several items deviate for it
# retained     the parts of the item the target keeps, as testable statements, with requires_test = true:
#              a partial deviation, whose item stays required by make trace in the decided mode
# gate_units   for a partial invariant: the units of its components, each of which needs its own test
# scenarios    equivalence scenarios whose legacy result the target does not reproduce ("COSGN00C S10")
# approved_by, approved_on   who accepted the deviation, and when (YYYY-MM-DD)
#
# make verify-ledger checks that every item exists in the spec and that every architecture-dependent
# item of docs/modernization/architecture/decisions.md has an entry of that kind.
# Fields: modernization/verify/trace/README.md.

schema = 1

# invariants

[deviation."INV-001"]
kind = "architecture-dependent"
decision = "none"
group = "DEV-ARCH-05"
legacy = "Online writers compute highest + 1 and posting takes the file's IDs; nothing coordinates them."
target = "TRAN-ID stays unique: in fixed mode generated IDs come from the reserved range, which file IDs may not use, and the claim check fails the ingest, in both modes, when a file ID meets another staged row, a waiting add or a master row, or in fixed mode is reserved (TRAN_ID_RESERVED); UX_tran_master is the backstop"
retained = ["BILL: two payments never get the same ID (both modes); a payment whose master insert breaks UX_tran_master rolls back completely, with no core.transaction row, no change to core.account or core.tcat_bal and no billpay.payment row, and gives 409 TRAN_ID_EXISTS with Tran ID already exist..., as billpay-slice.md step 10 and ERR-BILL-001 give it; in fixed mode, generated IDs are reserved IDs.", "TRNA: two adds never get the same ID (both modes, S21); a UX_daily_waiting violation gives 409 TRAN_ID_EXISTS and writes nothing, not even the audit row; in fixed mode, generated IDs are reserved IDs.", "POST: a file ID that is duplicated, equal to a waiting add or master row, or reserved (fixed mode) fails the claim with nothing posted, and the post backstop never half-applies.", "INTC: interest IDs are unique within the run and against the cycle's posted rows; in fixed mode they are reserved IDs from the sequence, in legacy mode parm plus the 6-digit counter (DEF-INTC-010), and a second run of the cycle is refused (D-BAT-10); a UX_tran_master violation fails the chunk and rolls back that account's interest and balance update."]
requires_test = true
gate_units = ["BILL", "TRNA", "POST", "INTC"]
source = "docs/modernization/architecture/batch.md (transaction IDs from the file and from the services), docs/modernization/architecture/transaction-service.md sections 6 and 9"
note = "Each unit's test cites INV-001 together with that unit's own item: BR-BILL-004 (and ERR-BILL-001 for the forced duplicate), BR-TRNA-003, ERR-POST-004 or DEF-INTC-010. The ruling adds tests and a rollback obligation; it changes no response that an approved unit contract already gives. A tran_id is reserved when it is 16 ASCII digits starting with 9 (9000000000000000 to 9999999999999999), tested by characters, never by a numeric parse; the user approved the range on 2026-11-10."
approved_by = "architect (transaction-service.md section 6)"
approved_on = "2026-11-10"

[deviation."INV-002"]
kind = "decision"
decision = "D-18"
legacy = "CLOSEFIL closes the online files for the cycle, so the online functions stop."
target = "The batch window runs in mode WRITES_BLOCKED: sign-on and every read keep working, writes are refused while the cycle runs"
scenarios = ["COSGN00C S10"]
source = "catalog D-18 (override), docs/modernization/architecture/decisions.md D-BAT-05"
approved_by = "user (decision catalog answers)"
approved_on = "2026-11-06"

