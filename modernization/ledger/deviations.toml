[deviation."SE-MQDT-003"]
kind = "architecture-dependent"
decision = "none"
legacy = "The get, the read and the puts were one MQ unit of work, so a failed request left exactly one error record."
target = "On the crash path a death between a record's confirm and the reject adds a second record with the same correlation_id and a higher x-carddemo-delivery-count (records of a request with neither message_id nor correlation_id cannot be matched to it), and no record is left when every delivery from the sixth to the eleventh ends (crash, lost channel or record not confirmed) before a record is confirmed; the broker backstop (x-delivery-limit 10) then dead-letters the request, and the broker log, the .dlq and the M006 lines are the only trace; for an oversized request no record is left when every delivery up to the eleventh ends before a record is confirmed"
retained = ["On the handled give-up of a reply that cannot be confirmed, exactly one MQPUT ERR record naming the reply destination is confirmed, then the request is rejected without requeue to its .dlq, with no error reply (D8).", "An oversized request gets one confirmed INP MQGET ERR: record before its reject (D5).", "Each error record carries correlation_id = the request's message_id, else its correlation_id, else none, and the header x-carddemo-delivery-count; no request body and no account data (D5, D8)."]
requires_test = true
source = "docs/modernization/architecture/inquiry-service.md sections 1.2 to 1.5 (architecture commit 2b5e102)"
note = "Intentional architecture deviation, ratified under the product delegation on 2026-11-11 (WP5 delivery semantics). AMQP has no transaction across a consume, a database read and a publish to another queue, and a stored outbox would need a write grant on a service that is read-only by design. The broker backstop is finite so that a message that crashes the service on every delivery still leaves the queue; a store is a possible stronger alternative and is not chosen. The error record is not an absolute at-least-once guarantee per request. Tests I17 and I23 to I30 against the real pinned broker, with genuine publisher nacks and channel closes, are required before acceptance. Not yet implemented."
approved_by = "architect (inquiry-service.md), ratified under the product delegation"
approved_on = "2026-11-11"

