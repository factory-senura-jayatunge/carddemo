source = "docs/modernization/architecture/inquiry-service.md sections 1.2 to 1.5 (architecture commit 2b5e102)"
note = "Intentional architecture deviation, ratified under the product delegation on 2026-11-11 (WP5 delivery semantics). AMQP has no transaction across a consume, a database read and a publish to another queue, and a stored outbox would need a write grant on a service that is read-only by design. The broker backstop is finite so that a message that crashes the service on every delivery still leaves the queue; a store is a possible stronger alternative and is not chosen. The error record is not an absolute at-least-once guarantee per request. Tests I17 and I23 to I30 against the real pinned broker, with genuine publisher nacks and channel closes, are required before acceptance. Not yet implemented."
approved_by = "architect (inquiry-service.md), ratified under the product delegation"
approved_on = "2026-11-11"

