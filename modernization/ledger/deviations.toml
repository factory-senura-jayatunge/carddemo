retained = ["A request leaves its queue only by an acknowledgement after its confirmed reply (I6, I19), by a reject without requeue to its .dlq (I12, I17), or, when no delivery up to the eleventh ends in the service's acknowledgement or its reject without requeue, by the broker backstop (x-delivery-limit 10) after the eleventh delivery (I26)."]
