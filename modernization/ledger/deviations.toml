# programs/CODATE01.md

[deviation."BR-MQDT-005"]
kind = "architecture-dependent"
decision = "none"
legacy = "One MQ unit of work per request: each request got exactly one reply before the next get."
target = "At least once on the crash path: a death between a confirmed reply and its acknowledgement redelivers the request, which is answered again; when the request has a message_id the duplicate repeats the first reply's message_id (the name-based UUID of \"MQDT:\" + the request's message_id in fixed mode) and correlation_id, and without one it cannot be matched by ID"
retained = ["In every run without a crash, each request that is answered gets exactly one confirmed reply before its acknowledgement, and requests are answered one at a time in arrival order, with concurrency 1 per listener (D4).", "A request without a message_id is answered and never rejected or dead-lettered for the absence (W5)."]
requires_test = true
source = "docs/modernization/architecture/inquiry-service.md sections 2 and 5 (architecture commit 2b5e102)"
note = "Ratified under the product delegation on 2026-11-11. No duplicate store: the service is read-only and a second answer changes no data. A duplicate account reply is read again from the current row, so its body can differ; the requester keeps the first reply for an ID. A request held by the delayed retry is overtaken by later ones (section 5, Q5). Not yet implemented."
approved_by = "architect (inquiry-service.md), ratified under the product delegation"
approved_on = "2026-11-11"

