[deviation."ERR-MQAC-005"]
kind = "architecture-dependent"
decision = "none"
legacy = "The get, the read and the puts were one MQ unit of work, so a failed request left exactly one error record."
target = "On the crash path a death between a record's confirm and the reject adds a second record with the same correlation_id and a higher x-carddemo-delivery-count (records of a request with neither message_id nor correlation_id cannot be matched to it), and no record is left when every delivery from the sixth to the eleventh ends (crash, lost channel or record not confirmed) before a record is confirmed; the broker backstop (x-delivery-limit 10) then dead-letters the request, and the broker log, the .dlq and the M006 lines are the only trace"
retained = ["On the handled give-up of a failed account read, exactly one ERROR WHILE READING ACCTF record naming the request queue is confirmed, then one error reply is attempted, then the request is rejected without requeue to its .dlq (I17, I26b, I27).", "Each error record carries correlation_id = the request's message_id, else its correlation_id, else none, and the header x-carddemo-delivery-count; no request body and no account data (I12, I17, I29)."]
