note = "Answered for the target: part (b), what the target writes, by D-11 as clarified in two delegated decisions of 2026-11-11, the DEF-ACUP-002 layout ruling v4 (account 113-122) and option O2 for the rest of the unset FILLER (DEF-ACUP-020). Canonical text: architecture commits fd17316 (data-model.md, FILLER and layout quirks; the switches.md DEF-ACUP-002 row; account-service.md section 12) and 7c8e03e (data-model.md, unset FILLER of the update layouts). Account 113-122: the 20 characters of 103-122 as read and their origin (as read or migrated) are kept in the batch-only columns legacy_zip_group and zip_group_origin, which no service reads and which are dropped at cut-over with legacy_filler (D-DATA-03). Export is per row and state-based: when the current ZIP and group equal their load-time values, 103-122 is written back as read, NULs and padding included, also after an edit that was changed back; otherwise the CVACT01Y layout is written (ZIP at 103, group at 113, padded with spaces). A record declared in the update layout must have 113-122 blank (all spaces or all NUL), or the load fails before any write. Account 123-300 is kept as stored in legacy_filler, U+0000 included, with no constant check; account update never writes it and the exporter writes it back. Customer 333-500: the loader accepts any content there and stores nothing for it (no customer FILLER column is added and z/OS residue is never reproduced), and every customer export writes 168 spaces. The load report counts the customer records whose 333-500 was not all spaces and names their file lines, never a customer ID or the bytes (D-NFR-04). The bundled ASCII and EBCDIC customers hold spaces there, so their outputs do not change. Part (a), what z/OS actually leaves in the unset FILLER, stays an unobserved mainframe fact; the target does not depend on it. Not yet implemented."

