note = "Fixed mode: every ID the services generate (online add, bill payment, interest) comes from core.tran_id_seq with MINVALUE 9000000000000000, MAXVALUE 9999999999999999 and NO CYCLE, so every generated ID is reserved. A tran_id is reserved when it is 16 ASCII digits starting with 9 (9000000000000000 to 9999999999999999), tested by characters, never by a numeric parse; the user approved the range on 2026-11-10. A daily file must not use reserved IDs: in fixed mode the claim check fails the ingest (TRAN_ID_RESERVED), and every other legacy file ID stays accepted. Legacy mode keeps highest + 1 under a lock."

