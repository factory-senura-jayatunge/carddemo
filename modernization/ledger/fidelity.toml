# Fidelity ledger: the decided behaviour of every defect-decide item that keeps a legacy mode, and
# of the decided questions of the converted units. Items with no legacy mode are in deviations.toml.
#
# value        legacy (the COBOL behaviour) or fixed (the fix the item describes)
# code_switch  true when the code branches on the item through FidelitySwitches; false when the
#              behaviour is decided but the code has no branch (yet)
# setting      the chosen variant when the fix has more than one (only with value = "fixed")
# decision     the decision of docs/modernization/decisions/README.md, or "none"
# approved_by, approved_on   who approved the value, and when (YYYY-MM-DD)
# note         why, when it is not the plain fix
#
# platform/fidelity loads value into carddemo.fidelity.<ID>; a missing entry means legacy.
# make verify-ledger checks this file against the spec, the catalog and the code.
# Fields: modernization/verify/trace/README.md.

schema = 1

