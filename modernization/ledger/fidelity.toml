# Note on BR-ACUP-108 (no entry): Character set of the free-text fields (account-service.md section 12, 2026-11-10).
#   No class change and no entry: the item stays must-preserve and required as the spec states it. Account update's
#   groupId (10), addrLine1 (50), addrLine2 (50) and govtIssuedId (20) accept every character from U+0000 to U+00FF,
#   the 256 characters a legacy X(n) byte holds, controls, NUL and U+00A0 included, up to the approved lengths, which
#   are unchanged and count characters. A character above U+00FF, which no legacy byte holds, is refused with 400
#   UNSUPPORTED_CHARACTER, <label> contains a character that is not supported., with that field, and nothing is
#   written. Every value a 3270 terminal could enter is accepted with the same length. No ASCII or byte cap and no
#   switch is added. Only trailing spaces (U+0020) are removed from these fields; whether that padding rule reaches
#   other fields waits for an architect clarification, and card update keeps its own trim rules. The unit is not in
#   scope.toml, so trace does not gate it yet; the tests are named when the unit is converted.

