note = "Delegated decision of 2026-11-11 on the DEF-ACUP-002 full-input layout (D-11), approving the architect's ruling v4. Canonical text: architecture commit fd17316 (data-model.md, FILLER and layout quirks; the switches.md DEF-ACUP-002 row; account-service.md section 12). The implementation is pending. D-11's move of 103-112 into the group applies only to records whose layout is declared, never inferred from content, file name or place. Default in both modes: every account record is stored as read in the CVACT01Y layout, ZIP 103-112 and group 113-122, unknown groups and NUL kept as data, only trailing spaces removed. Fixed mode migrates a record (group = 103-112, ZIP empty) only when a layout manifest bound to the input file's SHA-256 declares it ACUP_UPDATE: one built-in entry for app/data/ASCII/acctdata.txt (SHA-256 c2a97b6a32dc4a87a7aafdf7f72e6712e560412d30b00c5526cca80fc9dfd260, every record), the population D-11 decided, or a validated manifest supplied through the property carddemo.data-load.account-layout-manifest. The EBCDIC copy has no entry (its account 49 holds ZEROAPR at 103), so it loads as read. Legacy mode ignores every manifest. The step hashes and classifies the same bytes it reads once; a restart whose input hashes differ fails with SOURCE_FILE_CHANGED before any write. A manifest that is invalid or names another hash, or a declared ACUP_UPDATE record whose 113-122 is not blank (blank: all spaces or all NUL), fails the step before any account is written. Undeclared records with a blank 113-122 and a non-blank 103-112 are reported by file line and count; diagnostics never name account IDs (D-NFR-04). Export is per row and state-based, with no mode-wide swap (Q-ACUP-001, Q-ACUP-010). verify-data checks the stored ZIP, group and origin independently. The harness supplies an explicit manifest for every prepared account file; on the stress data fixed INTCALC writes 128 interest records and changes accounts 4, 8, 9 and 10 only (legacy 124)."

