# programs/COACCT01.md

[switch."DEF-MQAC-001"]
value = "legacy"
code_switch = false
decision = "D-72"
approved_by = "user (decision catalog answers)"
approved_on = "2026-11-06"
note = "D-72: the code's contract is implemented, not the README's."

[switch."DEF-MQAC-002"]
value = "fixed"
code_switch = true
decision = "D-73"
approved_by = "user (decision catalog answers)"
approved_on = "2026-11-06"
note = "One of the three inquiry code switches (DEF-MQAC-002, DEF-MQDT-002, DEF-MQDT-003); no fourth switch (inquiry-service.md, architecture commit 2b5e102). Covers BR-MQAC-005 and the correlation part of DEF-MQAC-003 (D-73 decided them together): they have no switch of their own, and the tests W1, W2 and W6 cite all three IDs in both modes. Legacy: replies go to the fixed reply queue and copy the request's message_id and correlation_id. Fixed: replies go to reply_to (else the fixed queue), with correlation_id = the request's message_id (else its correlation_id, else none) and message_id = the name-based UUID of \"MQAC:\" + the request's message_id, so a duplicate repeats both IDs. A request without a message_id is valid: it is answered and never rejected or dead-lettered for the absence. Legacy mode copies the IDs as they are, so an absent message_id stays absent; fixed mode sets the reply's correlation_id to the request's correlation_id, or none, and gives the reply a random message_id, so a duplicate of such a request cannot be matched by ID (a stated limit). No body-derived identity and no new mandatory header. The DEF-MQAC-003 deviation (DEV-ARCH-10, properties set explicitly) stays. Not yet implemented."

[switch."DEF-MQAC-007"]
value = "fixed"
code_switch = false
decision = "D-74"
approved_by = "user (decision catalog answers)"
approved_on = "2026-11-06"
note = "D-74, fixed-only: a file error no longer loses the request or stops the server. The service owns the give-up (inquiry-service.md section 1, architecture commit 2b5e102). A failed account read with x-delivery-count below 5 is rejected with requeue and gets no reply; at 5 or more the service publishes the error record ERROR WHILE READING ACCTF and waits for its confirm, then publishes the error reply (ERROR WHILE READING ACCTFILE ACCT ID : and the 11 key bytes as received, or JSON status ERROR) and waits for its confirm, then rejects without requeue to the .dlq: record, reply, reject, in that order. Without a crash a failing request gets 6 deliveries. The two inquiry request queues have x-delivery-limit 10, only as a broker backstop. A record that is not confirmed requeues the request (M006) and the give-up runs again; an error reply that is not confirmed is logged (M004) and does not stop the path. The crash-path limits of the record are a ratified deviation (deviations.toml, ERR-MQAC-005 and SE-MQAC-004). Not yet implemented."

[switch."DEF-MQAC-014"]
