[switch."DEF-MQDT-003"]
value = "fixed"
code_switch = true
decision = "D-73"
approved_by = "user (decision catalog answers)"
approved_on = "2026-11-06"
note = "One of the three inquiry code switches (DEF-MQAC-002, DEF-MQDT-002, DEF-MQDT-003); no fourth switch (inquiry-service.md, architecture commit 2b5e102). Fixed: the reply's correlation_id is the request's message_id (else its correlation_id, else none) and its message_id the name-based UUID of \"MQDT:\" + the request's message_id, so a duplicate repeats both IDs. A request without a message_id is valid: it is answered and never rejected or dead-lettered for the absence. Legacy mode copies the IDs as they are, so an absent message_id stays absent; fixed mode sets the reply's correlation_id to the request's correlation_id, or none, and gives the reply a random message_id, so a duplicate of such a request cannot be matched by ID (a stated limit). No body-derived identity and no new mandatory header. Not yet implemented."

