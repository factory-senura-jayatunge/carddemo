note = "Answered for the target by D-11 as clarified on 2026-11-11 (DEF-ACUP-002). Canonical text: architecture commit fd17316 (data-model.md, FILLER and layout quirks; the switches.md DEF-ACUP-002 row; account-service.md section 12). Positions 103-112 are the account ZIP and 113-122 the group ID, the CVACT01Y layout every reader uses; the target stores them in addr_zip and group_id, and interest reads group_id. Records are kept in that layout as read. Only records whose update layout (group at 103) a SHA-256-bound manifest declares are migrated, in fixed mode only; the built-in manifest covers the ASCII sample alone. Content never decides: undeclared records whose 113-122 is blank and 103-112 is not are reported by file line and count, not moved. Account update writes group_id only. Not yet implemented."

