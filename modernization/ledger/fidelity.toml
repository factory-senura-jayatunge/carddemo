# Fidelity ledger: the decided behaviour of every defect-decide item that keeps a legacy mode, of the
# decided questions of the converted units, and the decided fixes of items of another fidelity class
# (value = "fixed", code_switch = false, a catalog decision). Items with no legacy mode are in
# deviations.toml.
#
# value        legacy (the COBOL behaviour) or fixed (the fix the item describes)
# code_switch  true when the code branches on the item through FidelitySwitches (exactly the items of
#              docs/modernization/architecture/switches.md); false when the item is built and tested in
#              its decided mode only. A note "Covered by the switch <ID>" names the switch whose
#              both-mode tests also cite the item.
# setting      the chosen variant when the fix has more than one (only with value = "fixed")
# decision     the decision of docs/modernization/decisions/README.md, or "none"
# approved_by, approved_on   who approved the value, and when (YYYY-MM-DD)
# note         why, when it is not the plain fix
#
# A comment "Note on <ID> (no entry)" records an architect clarification of an item that keeps its class
# and has no entry, so trace requires it as the spec states it.
#
# platform/fidelity loads value into carddemo.fidelity.<ID>; a missing entry means legacy.
# make verify-ledger checks this file against the spec, the catalog and the code.
# Fields: modernization/verify/trace/README.md.

