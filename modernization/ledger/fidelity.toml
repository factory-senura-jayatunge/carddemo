approved_by = "user (decision catalog answers)"
approved_on = "2026-11-06"

[switch."ERR-MQAC-005"]
value = "fixed"
code_switch = false
decision = "D-74"
approved_by = "user (decision catalog answers)"
approved_on = "2026-11-06"
note = "D-74, fixed-only: an error reply plus the dead-letter after retries. The service owns the give-up (inquiry-service.md section 1, architecture commit 2b5e102). A failed account read with x-delivery-count below 5 is rejected with requeue and gets no reply; at 5 or more the service publishes the error record ERROR WHILE READING ACCTF and waits for its confirm, then publishes the error reply (ERROR WHILE READING ACCTFILE ACCT ID : and the 11 key bytes as received, or JSON status ERROR) and waits for its confirm, then rejects without requeue to the .dlq: record, reply, reject, in that order. Without a crash a failing request gets 6 deliveries. The two inquiry request queues have x-delivery-limit 10, only as a broker backstop. A record that is not confirmed requeues the request (M006) and the give-up runs again; an error reply that is not confirmed is logged (M004) and does not stop the path. The crash-path limits of the record are a ratified deviation (deviations.toml, ERR-MQAC-005 and SE-MQAC-004). Not yet implemented."

